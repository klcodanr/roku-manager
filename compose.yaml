services:
  roku-manager:
    image: ghcr.io/klcodanr/roku-manager:latest
    # SSDP discovery needs the host's LAN interface and multicast route.
    network_mode: host
    environment:
      DATA_FILE: /app/data/state.json
      EVENT_LOG_DIR: /app/data/events
      TZ: ${TZ:-America/New_York}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENFORCEMENT_INTERVAL_MS: ${ENFORCEMENT_INTERVAL_MS:-15000}
      MIGRATE_DATA: ${MIGRATE_DATA}
      DISABLE_AUTH: ${DISABLE_AUTH:-false}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me}
    volumes:
      - roku-manager-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${PORT:-3000}/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  roku-manager-data:
